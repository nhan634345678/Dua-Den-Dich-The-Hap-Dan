function busy(){return ['feedback','wheelReady','spinning','wheelResult'].includes(state.phase);}
function runnerSVG(i){const skin=['#e5b18b','#b67c58','#edb89a','#c18d70'][i],hair=['#26314b','#493022','#22253e','#4f2d31'][i],color=COLORS[i];return '<svg viewBox="0 0 72 72" aria-hidden="true"><ellipse cx="36" cy="67" rx="22" ry="3" fill="#182f4525"/><g class="runner-body"><g class="leg back-leg"><path d="M34 43l13 8-4 13" stroke="#223754" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M40 64h11" stroke="#f6fcff" stroke-width="5" stroke-linecap="round"/><path d="M41 67h11" stroke="'+color+'" stroke-width="2" stroke-linecap="round"/></g><g class="arm back-arm"><path d="M42 29l8 6 10-12" stroke="'+skin+'" stroke-width="5" fill="none" stroke-linecap="round"/></g><path d="M30 23l-7 20 15 6 10-21z" fill="'+color+'"/><path d="M29 27l12 4-6 14-10-3z" fill="#ffffff15"/><path d="M26 40l13 5" stroke="#ffffffc0" stroke-width="2"/><path d="M33 24l3-9h7l-3 12" fill="'+skin+'"/><g class="leg front-leg"><path d="M30 44L20 60l-10 3" stroke="#142945" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M8 64l12-3" stroke="#f6fcff" stroke-width="5" stroke-linecap="round"/><path d="M8 67l12-3" stroke="'+color+'" stroke-width="2" stroke-linecap="round"/></g><g class="arm front-arm"><path d="M29 29l-11 8-9-6" stroke="'+skin+'" stroke-width="5" fill="none" stroke-linecap="round"/></g><circle cx="42" cy="13" r="9" fill="'+skin+'"/><path d="M33 14C29-3 52-4 53 9l-13-3-3 10z" fill="'+hair+'"/><path d="M34 9l15-2" stroke="'+color+'" stroke-width="3" stroke-linecap="round"/><circle cx="47" cy="14" r="1.15" fill="#273246"/><path d="M46 19h3" stroke="#815039" stroke-width="1.3" stroke-linecap="round"/><path d="M35 46h8" stroke="#ffffff40" stroke-width="1.5"/></g></svg>';}
function renderBoard(){const board=$('board');if(!board.children.length)COLORS.forEach((color,i)=>{const lane=document.createElement('div');lane.className='lane';lane.style.setProperty('--team',color);lane.innerHTML='<div class="team-label"><button class="team-select" aria-label="Chọn Tổ '+(i+1)+' trả lời">Tổ '+(i+1)+'</button><span class="team-score" id="score'+i+'"></span><span class="status-badge" hidden></span></div><div class="track"><div class="trail"></div><div class="finish-line"></div><div class="runner">'+runnerSVG(i)+'</div></div><div class="lane-actions"><button class="rewind" aria-label="Hoàn tác cộng bước Tổ '+(i+1)+'" title="Hoàn tác lần cộng vừa rồi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5L4 10l5 5M4 10h10a6 6 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="plus" aria-label="Cộng một bước Tổ '+(i+1)+'">+</button></div>';lane.querySelector('.team-select').onclick=()=>chooseTeam(i);lane.querySelector('.plus').onclick=()=>manualPlus(i);lane.querySelector('.rewind').onclick=()=>{if(historyKinds.at(-1)?.manualTeam===i)undo();};lane.querySelector('.runner').addEventListener('transitionend',event=>{if(event.propertyName==='left')event.currentTarget.classList.remove('moving');});board.append(lane);});COLORS.forEach((color,i)=>{const lane=board.children[i];lane.classList.toggle('active',i===state.current);lane.querySelector('.team-select').disabled=busy()||state.screen!=='game'||state.correct||state.wrong.length>0||state.skips[i];lane.querySelector('.team-select').setAttribute('aria-pressed',String(i===state.current));$('score'+i).innerHTML=state.scores[i]+'<small>/20</small>';const runner=lane.querySelector('.runner'),left=state.scores[i]*5+'%';if(runner.style.left&&runner.style.left!==left)runner.classList.add('moving');runner.style.left=left;lane.querySelector('.trail').style.width=state.scores[i]*5+'%';lane.querySelector('.plus').disabled=busy()||state.screen!=='game'||state.scores[i]===20;lane.querySelector('.rewind').disabled=busy()||state.screen!=='game'||historyKinds.at(-1)?.manualTeam!==i;const badge=lane.querySelector('.status-badge');badge.hidden=!state.skips[i]&&!state.shields[i];badge.textContent=[state.skips[i]?'BỎ LƯỢT':'',state.shields[i]?'KHIÊN':''].filter(Boolean).join(' · ');});$('turnLabel').textContent='TỔ '+(state.current+1)+' TRẢ LỜI';$('raceNotice').textContent=state.notice;}
function chooseTeam(i){if(state.screen!=='game'||busy()||state.correct||state.wrong.length>0||state.skips[i])return;remember();state.current=i;save();render();}
function finishIfReached(){const reached=state.scores.flatMap((n,i)=>n===20?[i]:[]);if(!reached.length)return false;state.finish=reached;state.screen='result';state.notice='Đã chạm vạch đích';return true;}
function manualPlus(i){if(state.screen!=='game'||busy()||state.scores[i]===20)return;remember({manualTeam:i});state.scores[i]++;state.notice='Tổ '+(i+1)+' tiến thêm 1 bước.';finishIfReached();save();if(state.screen==='result')render();else{renderBoard();updateControls();}}
function renderQuestion(animate=false){const q=QUESTIONS[state.question];$('counter').textContent='CÂU '+(state.question+1)+' / 20';$('question').innerHTML=formatted(q.q);$('question').classList.toggle('long',q.q.length>105);$('answers').replaceChildren();q.a.forEach((text,i)=>{const button=document.createElement('button');button.className='answer';button.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'</span><span class="answer-text">'+formatted(text,isFormula(text))+'</span><span class="answer-status"></span>';if(state.wrong.includes(i)){button.classList.add('wrong');button.querySelector('.answer-status').textContent='SAI';}if((state.correct||state.wrong.length>0)&&i===q.key){button.classList.add('correct');button.querySelector('.answer-status').textContent='ĐÚNG';if(animate&&state.correct){button.classList.add('open-wheel');button.addEventListener('animationend',()=>{if(state.phase==='feedback'&&state.screen==='game'){state.phase='wheelReady';save();render();}},{once:true});}}button.disabled=state.correct||state.wrong.length>0;button.onclick=()=>answer(i);$('answers').append(button);});$('feedback').className='feedback'+(state.correct?' good':state.wrong.length?' bad':'');$('feedback').innerHTML=state.correct?formatted('Đúng! '+q.e):state.wrong.length?formatted('Sai. Đáp án đúng: '+String.fromCharCode(65+q.key)+'. '+q.e):'';$('nextButton').textContent=state.question===19?'Tổng kết':'Câu tiếp';}
function updateControls(){$('undoButton').disabled=!history.length||state.phase==='spinning';$('nextButton').disabled=busy();$('resultUndo').disabled=!history.length;}
function render(animate=false){for(const id of ['title','game','result'])$(id+'Screen').hidden=state.screen!==id;renderBoard();updateControls();if(state.screen==='game')renderQuestion(animate);if(state.screen==='result')renderResult();renderWheel();}
function answer(i){if(state.screen!=='game'||state.phase!=='question'||state.correct||state.wrong.length>0)return;remember();if(i===QUESTIONS[state.question].key){state.correct=true;state.scores[state.current]=Math.min(20,state.scores[state.current]+1);state.phase='feedback';state.notice='Tổ '+(state.current+1)+' trả lời đúng: tiến 1 bước.';finishIfReached();}else{state.wrong.push(i);state.notice='Sai: giữ nguyên vị trí.';}save();render(true);}
function next(keepNotice=false){if(state.screen!=='game'||busy())return;remember();if(state.question===19){state.screen='result';state.finish=[];}else{const skipped=[];for(let offset=1;offset<=4;offset++){const team=(state.current+offset)%4;if(state.skips[team]){state.skips[team]=false;skipped.push(team+1);continue;}state.current=team;break;}state.question++;state.wrong=[];state.correct=false;state.phase='question';state.effect=-1;state.target=-1;state.notice=(keepNotice?state.notice+' ':'')+(skipped.length?'Bỏ lượt Tổ '+skipped.join(', ')+'. Đến Tổ '+(state.current+1)+'.':keepNotice?'Đến Tổ '+(state.current+1)+'.':'Đúng: +1 bước và quay. Sai: đứng yên.');}save();render();}
function wheelSVG(){let paths='',labels='';EFFECTS.forEach((e,i)=>{const a=(-90+i*45)*Math.PI/180,b=a+Math.PI/4;const x=220+211*Math.cos(a),y=220+211*Math.sin(a),x2=220+211*Math.cos(b),y2=220+211*Math.sin(b);paths+='<path d="M220 220L'+x+' '+y+'A211 211 0 0 1 '+x2+' '+y2+'Z" fill="'+e.color+'" stroke="#ffffff55" stroke-width="2"/>';const mid=(-90+i*45+22.5)*Math.PI/180,lx=220+143*Math.cos(mid),ly=220+143*Math.sin(mid);labels+='<g transform="translate('+lx+' '+ly+') rotate('+(i*45+22.5)+')"><text text-anchor="middle" fill="white" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" font-weight="800"><tspan x="0" y="-3">'+e.short[0]+'</tspan><tspan x="0" y="15">'+e.short[1]+'</tspan></text></g>';});return '<svg viewBox="0 0 440 440" xmlns="http://www.w3.org/2000/svg">'+paths+labels+'</svg>';}
let overlayWasOpen=false;
function positionWheel(){if($('gameScreen').hidden)return;const bottom=document.querySelector('.race-board').getBoundingClientRect().bottom;document.documentElement.style.setProperty('--wheel-top',Math.ceil(bottom+10)+'px');}
function renderWheel(){const visible=state.screen==='game'&&['wheelReady','spinning','wheelResult'].includes(state.phase);$('wheelOverlay').hidden=!visible;if(!visible){overlayWasOpen=false;return;}if(!overlayWasOpen&&document.querySelector('.race-board').getBoundingClientRect().top<0)window.scrollTo({top:0,behavior:'instant'});positionWheel();if(!$('wheelDisc').children.length)$('wheelDisc').innerHTML=wheelSVG();$('wheelDisc').style.transform='rotate('+state.rotation+'deg)';$('targetGrid').replaceChildren();$('wheelDescription').textContent='';if(state.phase==='wheelReady'){$('wheelTitle').textContent='LUCKY BREAK';$('wheelDescription').textContent='Quay để nhận hiệu ứng bất ngờ. Mũi tên chỉ vào kết quả.';$('spinButton').textContent='QUAY NGAY';$('spinButton').disabled=false;}else if(state.phase==='spinning'){$('wheelTitle').textContent='SPINNING';$('wheelDescription').textContent='Vòng quay đang chọn hiệu ứng. Chờ xem kết quả nhé!';$('spinButton').textContent='ĐANG QUAY…';$('spinButton').disabled=true;}else{const effect=EFFECTS[state.effect];$('wheelTitle').textContent=effect.title;$('wheelDescription').textContent=effect.description+(effect.target?' Chọn tổ bên dưới rồi bấm Áp dụng.':' Bấm Áp dụng để sang câu tiếp theo.');if(effect.target){for(let i=0;i<4;i++){if(i===state.current)continue;const button=document.createElement('button');button.textContent='Tổ '+(i+1);button.classList.toggle('selected',state.target===i);button.setAttribute('aria-pressed',String(state.target===i));button.onclick=()=>{state.target=i;save();renderWheel();};$('targetGrid').append(button);}}$('spinButton').textContent='ÁP DỤNG & TIẾP TỤC';$('spinButton').disabled=!!effect.target&&state.target<0;}if(!overlayWasOpen){overlayWasOpen=true;$('wheelDialog').focus();}}
window.addEventListener('resize',positionWheel);
function spin(){if(state.screen!=='game'||state.phase!=='wheelReady')return;remember();const random=new Uint32Array(1);crypto.getRandomValues(random);state.effect=random[0]%8;state.target=-1;state.phase='spinning';const landing=(360-(state.effect*45+22.5))%360;state.rotation+=1800+(landing-state.rotation%360+360)%360;save();renderWheel();updateControls();}
function completeSpin(){if(state.phase!=='spinning')return;state.phase='wheelResult';save();renderWheel();updateControls();}
$('wheelDisc').addEventListener('transitionend',event=>{if(event.propertyName==='transform')completeSpin();});
function applyEffect(){if(state.screen!=='game'||state.phase!=='wheelResult')return;const effect=EFFECTS[state.effect],current=state.current,target=state.target;if(effect.target&&(target<0||target===current))return;remember();const advance=(team,amount)=>state.scores[team]=Math.min(20,state.scores[team]+amount);let notice='';switch(effect.id){case 'boost1':case 'boost2':case 'boost3':{const amount=Number(effect.id.slice(-1));advance(current,amount);notice='Tổ '+(current+1)+' được tiến thêm '+amount+' bước.';break;}case 'swap':case 'reset':if(state.shields[target]){state.shields[target]=false;notice='Khiên của Tổ '+(target+1)+' đã chặn '+(effect.id==='swap'?'hoán đổi.':'kéo về xuất phát.');}else if(effect.id==='swap'){[state.scores[current],state.scores[target]]=[state.scores[target],state.scores[current]];notice='Tổ '+(current+1)+' đổi vị trí với Tổ '+(target+1)+'.';}else{state.scores[target]=0;notice='Tổ '+(target+1)+' được kéo về vạch xuất phát.';}break;case 'skip':{const team=(current+1)%4;state.skips[team]=true;notice='Tổ '+(team+1)+' sẽ bỏ lượt tiếp theo.';break;}case 'shield':state.shields[current]=true;notice='Tổ '+(current+1)+' có khiên bảo vệ một lần.';break;case 'gift':advance(current,1);advance(target,1);notice='Tổ '+(current+1)+' và Tổ '+(target+1)+' cùng tiến 1 bước.';break;}state.notice=notice;state.phase='resolved';if(!finishIfReached()&&state.question===19){state.screen='result';state.finish=[];}save();if(state.screen==='game'){next(true);$('question').setAttribute('tabindex','-1');$('question').focus();}else render();}
function rankScores(){return state.scores.map((score,i)=>({score,i,rank:1+state.scores.filter(n=>n>score).length})).sort((a,b)=>b.score-a.score||a.i-b.i);}
function renderResult(){const ranked=rankScores(),max=ranked[0].score,winners=state.finish.length?state.finish:ranked.filter(x=>x.score===max).map(x=>x.i);$('resultTitle').textContent=winners.length>1?'CO-CHAMPIONS':'CHAMPIONS';$('winner').textContent=winners.map(i=>'Tổ '+(i+1)).join(' & ')+(winners.length>1?' · ĐỒNG CHIẾN THẮNG':' · NHÀ VÔ ĐỊCH');$('podium').replaceChildren();[1,0,2].forEach(index=>{const item=ranked[index],metal=item.rank===1?'gold':item.rank===2?'silver':'bronze';const column=document.createElement('div');column.className='podium-team '+metal;column.innerHTML='<div class="medal">'+item.rank+'</div><div class="podium-name">Tổ '+(item.i+1)+'</div><div class="podium-score">'+item.score+' / 20 bước</div><div class="pedestal">'+String(item.rank).padStart(2,'0')+'</div>';$('podium').append(column);});const last=ranked[3];$('fourth').textContent='Tổ '+(last.i+1)+' · '+last.score+' bước · Hạng '+last.rank;$('resultUndo').disabled=!history.length;if(!$('confetti').children.length){for(let i=0;i<34;i++){const bit=document.createElement('span');bit.style.cssText='left:'+((i*37)%100)+'%;top:'+((i*19)%80)+'%;background:'+['#f3d081','#a9dce9','#d49c6d'][i%3]+';transform:rotate('+(i*23)+'deg);animation-delay:-'+(i%5)+'s';$('confetti').append(bit);}}}
function undo(){if(!history.length||state.phase==='spinning')return;state=JSON.parse(history.pop());historyKinds.pop();if(state.phase==='feedback')state.phase='wheelReady';save();render();}
$('startButton').onclick=()=>{state=fresh();state.screen='game';history=[];historyKinds=[];save();render();};
$('replayButton').onclick=()=>{state=fresh();state.screen='game';history=[];historyKinds=[];save();render();};
$('nextButton').onclick=()=>next();$('undoButton').onclick=undo;$('resultUndo').onclick=undo;
$('spinButton').onclick=()=>state.phase==='wheelReady'?spin():state.phase==='wheelResult'?applyEffect():undefined;
$('fullscreenButton').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}};
document.addEventListener('keydown',event=>{if(!$('wheelOverlay').hidden&&event.key==='Tab'){const nodes=[...$('wheelDialog').querySelectorAll('button:not(:disabled)')];if(!nodes.length){event.preventDefault();return;}const first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement===$('wheelDialog'))){event.preventDefault();last.focus();}else if(!event.shiftKey&&(document.activeElement===last||document.activeElement===$('wheelDialog'))){event.preventDefault();first.focus();}return;}if(event.repeat||event.ctrlKey||event.metaKey||event.altKey||busy())return;if(state.screen==='game'&&/^[a-d]$/i.test(event.key)){event.preventDefault();answer(event.key.toUpperCase().charCodeAt(0)-65);}});
save();render();

</script></body></html>
